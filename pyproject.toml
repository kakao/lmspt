[project]
name = "lmspt"
version = "0.1.0"
description = "LMSPT: LM-Aligned Semantic Distillation for Speech Tokenization"
dependencies = [
    "transformers>=4.36.0",
    "descript-audiotools>=0.7.2",
    "huggingface_hub[cli]",
    "torch",
    "torchaudio",
    "hydra-core",
    "einops",
    "safetensors",
    "accelerate>=1.0",
    "datasets",
    "openai-whisper",
    "jiwer",
    "whisper_normalizer",
    "numpy",
    "psutil",
    "tqdm",
    "tensorboard",
]
packages = ["lmspt"]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "Apache-2.0"}

[project.urls]
Homepage = "https://github.com/kakao/lmspt"
Repository = "https://github.com/kakao/lmspt"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["lmspt"]
