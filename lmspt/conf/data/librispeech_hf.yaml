# Downloads openslr/librispeech_asr from the Hub and trains directly.
train_dataset:
  _target_: lmspt.dataset.codec_dataset.HFAudioSemanticFeatDataset
  path: openslr/librispeech_asr
  name: all
  split: "train.clean.100+train.clean.360+train.other.500"
  sample_rate: ${model.SAMPLE_RATE}
  segment_size: ${trainer.segment_size}
  feature_extractor: ${teacher.feature_extractor}
  # trust_remote_code: true  # uncomment if your `datasets` version requires it

valid_dataset:
  _target_: lmspt.dataset.codec_dataset.HFAudioSemanticFeatDataset
  path: openslr/librispeech_asr
  name: all
  split: validation.clean
  sample_rate: ${model.SAMPLE_RATE}
  segment_size: ${trainer.eval_segment_size}
  feature_extractor: ${teacher.feature_extractor}

train_loader:
  _target_: torch.utils.data.DataLoader
  dataset: ${data.train_dataset}
  batch_size: ${trainer.batch_size}
  num_workers: 16
  shuffle: true
  collate_fn:
    _target_: lmspt.dataset.codec_dataset.AudioSemanticFeatCollator

valid_loader:
  _target_: torch.utils.data.DataLoader
  dataset: ${data.valid_dataset}
  batch_size: ${trainer.eval_batch_size}
  num_workers: 16
  shuffle: false
  collate_fn:
    _target_: lmspt.dataset.codec_dataset.AudioSemanticFeatCollator
